name: Build README

on:
  push:
    branches:
      - main
    paths:
      - "report/**/*.md"
      - "report/*.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        run: |
          python3 <<'PY'
          from pathlib import Path

          README = Path("README.md")
          REPORT = Path("report")

          START = "<!-- AUTO-DOCS:START -->"
          END = "<!-- AUTO-DOCS:END -->"

          documents = []

          # =========================
          # FRONT MATTER
          # =========================

          front_matter = REPORT / "front-matter"

          if front_matter.exists():
              documents.extend(sorted(
                  file for file in front_matter.glob("*.md")
                  if file.name != "99-bibliography.md"
              ))

          # =========================
          # DOCUMENTACIÓN
          # =========================

          documents.extend(sorted(REPORT.glob("*.md")))

          bibliography = front_matter / "99-bibliography.md"
          if bibliography.exists():
              documents.append(bibliography)

          annexes = REPORT / "annexes"
          if annexes.exists():
              documents.extend(sorted(annexes.glob("*.md")))

          # =========================
          # GENERAR CONTENIDO
          # =========================

          sections = []

          for file in documents:
              print(f"Incluyendo: {file}")

              content = file.read_text(
                  encoding="utf-8"
              ).strip()

              # Resolve image paths from each source document before joining them in README.
              from urllib.parse import quote, unquote, urlsplit, urlunsplit
              import posixpath
              import re

              def image_url(url):
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith(("/", "#")):
                      return url

                  path = unquote(parts.path).replace("\\", "/")
                  if path.startswith(".report/assets/"):
                      path = path[1:]
                  elif not path.startswith("report/assets/"):
                      path = posixpath.normpath(
                          posixpath.join(file.parent.as_posix(), path)
                      )

                  if not path.startswith("report/assets/"):
                      return url

                  return urlunsplit((
                      "", "", quote(path, safe="/-._~"), parts.query, parts.fragment
                  ))

              content = re.sub(
                  r'''(<img\b[^>]*?\bsrc\s*=\s*["'])([^"']+)(["'])''',
                  lambda match: match.group(1) + image_url(match.group(2)) + match.group(3),
                  content,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              content = re.sub(
                  r"(!\[[^\]]*\]\()([^)]+)(\))",
                  lambda match: match.group(1) + image_url(match.group(2)) + match.group(3),
                  content,
              )

              if content:
                  sections.append(content)

          generated_content = "\n\n---\n\n".join(
              sections
          )

          # =========================
          # CONTENIDO AUTOMÁTICO
          # =========================

          automatic_content = (
              START
              + "\n\n"
              + generated_content
              + "\n\n"
              + END
          )

          # =========================
          # LEER README
          # =========================

          if README.exists():
              readme_content = README.read_text(
                  encoding="utf-8"
              )
          else:
              readme_content = "# PlantillaDA\n"

          # =========================
          # REEMPLAZAR BLOQUE
          # =========================

          if START in readme_content and END in readme_content:

              before = readme_content.split(
                  START,
                  1
              )[0]

              after = readme_content.split(
                  END,
                  1
              )[1]

              readme_content = (
                  before
                  + automatic_content
                  + after
              )

          else:

              readme_content = (
                  readme_content.rstrip()
                  + "\n\n"
                  + automatic_content
                  + "\n"
              )

          # =========================
          # GUARDAR README
          # =========================

          README.write_text(
              readme_content,
              encoding="utf-8"
          )

          print("")
          print("README generado correctamente.")
          print(
              f"Documentos incluidos: {len(documents)}"
          )

          PY

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README sin cambios."
            exit 0
          fi

          git commit -m "docs: rebuild README"

          git push origin main
